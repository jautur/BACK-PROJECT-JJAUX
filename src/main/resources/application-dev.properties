# Configuració només del perfil dev.

# Documentació de l'API: /swagger-ui.html i /v3/api-docs. Fora de dev no existeix.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# La base local de desenvolupament: si no es defineix SPRING_DATASOURCE_PASSWORD, la de sempre.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
