spring.application.name=jjaux-back
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/jjaux_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Secret de signatura dels tokens JWT. Mai al repositori: ve de la variable d'entorn AVISA_JWT_SECRET.
# Sense ella l'aplicació no arrenca (vegeu docs/configuracio.md).
avisa.jwt.secret=${AVISA_JWT_SECRET:}

# Contrasenya de l'administrador (admin@admin.es). Fora del perfil dev, sense ella l'aplicació no arrenca.
avisa.admin.password=${AVISA_ADMIN_PASSWORD:}
