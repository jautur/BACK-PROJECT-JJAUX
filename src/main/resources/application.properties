spring.application.name=jjaux-back
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/jjaux_db
spring.datasource.username=postgres
# Contrasenya de la base: ve de SPRING_DATASOURCE_PASSWORD. Només el perfil dev en té una per defecte (application-dev.properties).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Secret de signatura dels tokens JWT. Mai al repositori: ve de la variable d'entorn AVISA_JWT_SECRET.
# Sense ella l'aplicació no arrenca (vegeu docs/configuracio.md).
avisa.jwt.secret=${AVISA_JWT_SECRET:}

# Contrasenya de l'administrador (admin@admin.es). Fora del perfil dev, sense ella l'aplicació no arrenca.
avisa.admin.password=${AVISA_ADMIN_PASSWORD:}

# Orígens que poden cridar l'API directament des d'un navegador (separats per comes; mai '*').
# Per defecte: la mateixa màquina i la xarxa local, que és com el front crida el port 8080 des d'un mòbil.
avisa.cors.origens=${AVISA_CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*}

# Documentació de l'API (Swagger): desactivada per defecte; el perfil dev l'activa (application-dev.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Imatges de perfil i logotips: disc local (per defecte) o gcs (perfil Maven -Pgcs, encara no disponible)
avisa.imatges.emmagatzematge=${AVISA_IMATGES_EMMAGATZEMATGE:disc}
avisa.imatges.directori=${AVISA_IMATGES_DIRECTORI:${user.home}/.avisa/imatges}
# Límits de les imatges pujades, abans de descodificar-les (vegeu docs/configuracio.md)
avisa.imatges.max-bytes=${AVISA_IMATGES_MAX_BYTES:5242880}
avisa.imatges.max-pixels=${AVISA_IMATGES_MAX_PIXELS:40000000}

# Configuració de correu electrònic SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:info.avisa.service@gmail.com}
# Contrasenya d'aplicació SMTP: ve EXCLUSIVAMENT de la variable d'entorn SPRING_MAIL_PASSWORD
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# URL base de l'aplicació per a generar enllaços als emails
avisa.app.base-url=${AVISA_APP_BASE_URL:http://localhost:4200}

