spring.application.name=jjaux-back-test

# DataSource H2 en memòria per a l'execució de tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never

# Desactivar Flyway en tests ja que no necessiten l'esquema real
spring.flyway.enabled=false

# Secret NOMÉS per als tests: no val per a cap desplegament.
avisa.jwt.secret=nomes-per-als-tests-no-serveix-per-a-res-mes-0123456789
avisa.admin.password=admin-nomes-per-als-tests
avisa.cors.origens=http://localhost:*,http://192.168.*.*:*


avisa.imatges.directori=${java.io.tmpdir}/avisa-imatges-tests
avisa.imatges.max-bytes=5242880
avisa.imatges.max-pixels=40000000

# Configuració mock/test per a Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@avisa.com
spring.mail.password=testpassword

